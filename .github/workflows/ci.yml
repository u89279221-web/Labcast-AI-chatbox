name: LabCast-AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-level: '3.11'
      - name: Install dependencies
        run: |
          cd labcast-ai-backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: |
          cd labcast-ai-backend
          pytest

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and test
        run: |
          cd labcast-ai-frontend
          npm install
          npm run test -- --watchAll=false

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Create Mock Keystore for CI Build
        run: |
          mkdir -p secrets
          keytool -genkeypair -v -keystore secrets/release.keystore -alias labcastkey -keyalg RSA -keysize 2048 -validity 10000 -storepass labcastpass123 -keypass labcastpass123 -dname "CN=LabCast, OU=Engineering, O=College, L=City, S=State, C=US"
          echo "RELEASE_KEYSTORE_FILE=../secrets/release.keystore" > LabCastAI/secrets.properties
          echo "RELEASE_KEYSTORE_PASSWORD=labcastpass123" >> LabCastAI/secrets.properties
          echo "RELEASE_KEY_ALIAS=labcastkey" >> LabCastAI/secrets.properties
          echo "RELEASE_KEY_PASSWORD=labcastpass123" >> LabCastAI/secrets.properties
      - name: Grant execute permission for gradlew
        run: chmod +x LabCastAI/gradlew
      - name: Run JVM Unit Tests
        run: |
          cd LabCastAI
          ./gradlew test
      - name: Build Release APK
        run: |
          cd LabCastAI
          ./gradlew assembleRelease

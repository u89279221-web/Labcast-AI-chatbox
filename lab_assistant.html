<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabCast AI Assistant</title>
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #111827;
      --bg-chat-area: #0f172a;
      --bg-input: #1e293b;
      --accent-cyan: #38bdf8;
      --accent-blue: #2563eb;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header Bar */
    header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 14px 28px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .brand-title h1 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .brand-title p {
      font-size: 11px;
      color: var(--accent-cyan);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .clear-btn {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .clear-btn:hover {
      background-color: var(--accent-rose);
      color: #fff;
      border-color: var(--accent-rose);
    }

    .status-badge {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid var(--accent-emerald);
      color: var(--accent-emerald);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-emerald);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-emerald);
    }

    /* Main Container (Centered Full-Width ChatGPT / Gemini Style) */
    .container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }
    }

    .chat-panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      min-height: 640px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    /* Chat Messages Screen */
    .chat-messages {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
      background-color: var(--bg-chat-area);
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 14px;
      max-width: 88%;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.bot {
      align-self: flex-start;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .bot .avatar {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff;
    }

    .user .avatar {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
    }

    .bubble {
      padding: 15px 20px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .bot .bubble {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-top-left-radius: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .user .bubble {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .bubble ul, .bubble ol {
      margin-left: 20px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .bubble li {
      margin-bottom: 4px;
    }

    .code-block {
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin: 12px 0;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      color: #38bdf8;
      overflow-x: auto;
      position: relative;
    }

    .copy-code-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .copy-code-btn:hover {
      background: var(--accent-cyan);
      color: #000;
    }

    /* Animated Typing Dots */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Centered Input Bar */
    .chat-input-container {
      padding: 16px 24px;
      background: rgba(15, 23, 42, 0.85);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    .chat-input-container input {
      flex: 1;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 14px 20px;
      border-radius: 28px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .chat-input-container input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 28px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .send-btn:hover {
      opacity: 0.95;
      transform: scale(1.02);
    }

    footer {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">✨</div>
      <div class="brand-title">
        <h1>LabCast AI</h1>
        <p>Smart Conversational Assistant</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="clear-btn" onclick="resetChatSession()">
        <span>🗑️</span> New Chat
      </button>
      <div class="status-badge">
        <div class="status-dot"></div>
        Online
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    <div class="chat-panel">
      <!-- Chat Messages Window -->
      <div class="chat-messages" id="chatMessages">
        <!-- Professional Welcome Message -->
        <div class="message bot">
          <div class="avatar">✨</div>
          <div class="bubble">
            Hello! How can I help you today?
            <br><br>
            You can ask me questions on <strong>laboratory equipment, 3D printing, CNC machining, laser safety, electronics, programming, science, mathematics, or general topics.</strong>
          </div>
        </div>
      </div>

      <!-- Input Bar -->
      <div class="chat-input-container">
        <input type="text" id="userInput" placeholder="Ask a question..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">
          Send <span>➔</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    LabCast AI Assistant &copy; 2026
  </footer>

  <script>
    // Enforce Zero Saved History
    function enforceZeroStorage() {
      try {
        localStorage.clear();
        sessionStorage.clear();
      } catch (e) {}
    }

    function resetChatSession() {
      enforceZeroStorage();
      const messagesContainer = document.getElementById('chatMessages');
      messagesContainer.innerHTML = `
        <div class="message bot">
          <div class="avatar">✨</div>
          <div class="bubble">
            Hello! How can I help you today?
          </div>
        </div>
      `;
    }

    // Professional Universal Engine (Clean & Direct Responses)
    async function getAIResponse(query) {
      const q = query.toLowerCase();

      // DuckDuckGo Integration
      try {
        const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
        const res = await fetch(ddgUrl);
        const data = await res.json();
        if (data && data.AbstractText && data.AbstractText.length > 20) {
          return `<strong>${data.Heading || 'Overview'}:</strong><br><br>${data.AbstractText}<br><br><small style="color: var(--text-muted);">Source: ${data.AbstractSource || 'Knowledge Reference'}</small>`;
        }
      } catch (err) {}

      // 3D Printers
      if (q.includes('level') || q.includes('bed') || q.includes('z-offset') || q.includes('z offset')) {
        return `<strong>3D Printer Bed Leveling & Z-Offset Procedure:</strong><br>
        <ol>
          <li>Preheat the print bed to <strong>60°C</strong> to account for thermal expansion.</li>
          <li>Auto-Home all axes (G28).</li>
          <li>Slide a standard sheet of paper under the nozzle and adjust corner knobs until light friction is felt.</li>
          <li>Calibrate Z-Offset so the first layer compresses into a smooth, flat ribbon without scratching the bed.</li>
        </ol>`;
      }

      if (q.includes('temp') || q.includes('pla') || q.includes('petg') || q.includes('abs') || q.includes('tpu')) {
        return `<strong>3D Printing Material Temperature Guidelines:</strong><br>
        <ul>
          <li><strong>PLA:</strong> Nozzle <strong>200°C</strong> | Bed <strong>60°C</strong></li>
          <li><strong>PETG:</strong> Nozzle <strong>240°C</strong> | Bed <strong>75°C</strong></li>
          <li><strong>ABS / ASA:</strong> Nozzle <strong>250°C</strong> | Bed <strong>100°C</strong> (Enclosure recommended)</li>
          <li><strong>TPU (Flexible):</strong> Nozzle <strong>220°C</strong> | Bed <strong>50°C</strong></li>
        </ul>`;
      }

      if (q.includes('clog') || q.includes('click') || q.includes('extruder')) {
        return `<strong>Extruder & Nozzle Troubleshooting:</strong><br>
        <ol>
          <li><strong>Extruder Clicking:</strong> Indicates motor skipping due to excessive backpressure or low nozzle temperature. Increase temperature by 5°C.</li>
          <li><strong>Cold Pull:</strong> Heat nozzle to 220°C, push filament through, allow nozzle to cool to 90°C, then pull firmly to extract debris.</li>
          <li><strong>Needle Clearance:</strong> Insert a 0.4mm nozzle cleaning needle while heated.</li>
        </ol>`;
      }

      // CNC
      if (q.includes('cnc') || q.includes('milling') || q.includes('router') || q.includes('gcode')) {
        return `<strong>CNC Milling Operating Standards:</strong><br>
        <ul>
          <li><strong>Workholding:</strong> Secure stock firmly in a machine vise or clamp set to prevent part ejection.</li>
          <li><strong>Work Coordinate System (WCS):</strong> Zero X, Y, and Z axes using an edge finder or touch plate.</li>
          <li><strong>Spindle Speed & Feeds:</strong>
            <br>• Aluminum: 12,000–18,000 RPM with air blast / coolant mist.
            <br>• Wood/MDF: 16,000–24,000 RPM with high feed rates to avoid burning.
          </li>
        </ul>`;
      }

      // Laser
      if (q.includes('laser') || q.includes('engrav') || q.includes('acrylic') || q.includes('pvc')) {
        return `<strong>Laser Cutter Safety & Material Guidelines:</strong><br>
        <ul>
          <li><strong>Focal Distance:</strong> Verify laser head height using the focus block before cutting.</li>
          <li><strong>Exhaust Ventilation:</strong> Ensure air assist and exhaust filtration are active prior to firing.</li>
          <li><strong>Approved Materials:</strong> Wood, Acrylic (PMMA), Leather, Paper, Cardboard.</li>
          <li><strong>Forbidden Materials:</strong> Never cut PVC or Vinyl, as thermal decomposition releases toxic chlorine gas that damages lungs and corrodes equipment.</li>
        </ul>`;
      }

      // Soldering / Electronics
      if (q.includes('solder') || q.includes('flux') || q.includes('ohm')) {
        return `<strong>Electronics & Soldering Standards:</strong><br>
        <ul>
          <li><strong>Iron Temperature:</strong> Set iron to 350°C–380°C for leaded solder, or 380°C–400°C for lead-free solder.</li>
          <li><strong>Flux Usage:</strong> Apply rosin flux to facilitate heat transfer and prevent oxidation.</li>
          <li><strong>Ohm's Law:</strong> V = I × R (Voltage = Current × Resistance). Power P = V × I.</li>
        </ul>`;
      }

      // Coding
      if (q.includes('python') || q.includes('code') || q.includes('c++') || q.includes('arduino') || q.includes('esp32')) {
        return `<strong>Code Implementation Example:</strong><br>
        <div class="code-block">
          <button class="copy-code-btn" onclick="copySnippet(this)">📋 Copy</button>
# Python Microcontroller Serial & Data Handler
import time

def process_sensor_data(val):
    return round(val * 0.0976, 2)

print("Status: Active")
        </div>`;
      }

      // Clean & Professional General Technical Response
      return `<strong>Summary & Technical Guidance:</strong><br><br>
      Here are key technical details regarding <strong>"${query}"</strong>:<br><br>
      <ul>
        <li><strong>Core Concept:</strong> "${query}" involves fundamental principles in engineering, hardware control, or physical sciences.</li>
        <li><strong>Operational Guidelines:</strong> Verify system parameters, check connections, and perform clean test runs prior to full operation.</li>
        <li><strong>Follow-Up:</strong> Feel free to ask specific follow-up questions regarding equipment operating procedures, code implementations, or safety guidelines.</li>
      </ul>`;
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage('user', text);
      input.value = '';

      const typingId = appendTypingIndicator();

      setTimeout(async () => {
        const botReply = await getAIResponse(text);
        removeTypingIndicator(typingId);
        appendMessage('bot', botReply);
      }, 300);
    }

    function appendTypingIndicator() {
      const messagesContainer = document.getElementById('chatMessages');
      const id = 'typing_' + Date.now();
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message bot';
      msgDiv.id = id;
      msgDiv.innerHTML = `
        <div class="avatar">✨</div>
        <div class="bubble">
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return id;
    }

    function removeTypingIndicator(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function appendMessage(sender, text) {
      const messagesContainer = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerHTML = sender === 'bot' ? '✨' : '👤';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = text;

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      messagesContainer.appendChild(msgDiv);

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function copySnippet(btn) {
      const codeBlock = btn.parentElement;
      const codeText = codeBlock.innerText.replace("📋 Copy", "").trim();
      navigator.clipboard.writeText(codeText);
      btn.innerText = "Copied!";
      setTimeout(() => { btn.innerText = "📋 Copy"; }, 1500);
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      enforceZeroStorage();
    });
  </script>
</body>
</html>

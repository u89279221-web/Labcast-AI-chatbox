<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Printer AI Assistant - QR Code Photo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #1e293b;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    /* Photo Frame Styling */
    .photo-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 3px solid var(--accent-cyan);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.2);
      margin-bottom: 24px;
      position: relative;
    }

    .photo-header {
      margin-bottom: 20px;
    }

    .photo-header h1 {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .photo-header p {
      font-size: 13px;
      color: var(--accent-cyan);
      margin-top: 4px;
    }

    /* Embedded QR Code Canvas */
    .qr-frame {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 16px;
      display: inline-block;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .photo-footer {
      margin-top: 20px;
    }

    .photo-footer p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .photo-footer .url-badge {
      display: inline-block;
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }

    /* Action Buttons */
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #000;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      color: #fff;
    }

    .btn-secondary:hover {
      background-color: #334155;
    }

    @media print {
      body {
        background-color: #fff;
        color: #000;
      }
      .actions {
        display: none;
      }
      .photo-card {
        border-color: #000;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Photo Card -->
    <div class="photo-card" id="photoCard">
      <div class="photo-header">
        <h1>🤖 3D PRINTER AI ASSISTANT</h1>
        <p>Scan to Open Interactive Chatbot & SOP Guide</p>
      </div>

      <!-- QR Code Image -->
      <div class="qr-frame">
        <div id="qrcode"></div>
      </div>

      <div class="photo-footer">
        <p>Point your mobile camera at this code to launch:</p>
        <div class="url-badge" id="urlBadge">https://azizmnadaf26-glitch.github.io/LabCastAI-web/lab_assistant.html</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <a href="lab_assistant.html" class="btn btn-primary">🚀 Launch Chatbot Directly</a>
      <button class="btn btn-secondary" onclick="window.print()">🖨️ Print Photo Sticker</button>
      <a href="lab_chatbot_qr.png" download="lab_chatbot_qr.png" class="btn btn-secondary">📥 Download PNG Photo</a>
    </div>

  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const targetUrl = "https://azizmnadaf26-glitch.github.io/LabCastAI-web/lab_assistant.html";
      const qrElement = document.getElementById('qrcode');
      
      if (typeof QRCode !== 'undefined') {
        new QRCode(qrElement, {
          text: targetUrl,
          width: 220,
          height: 220,
          colorDark: "#0b0f19",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      } else {
        qrElement.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(targetUrl)}" alt="QR Code Photo">`;
      }
    });
  </script>
</body>
</html>
